<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veyon Web 控制端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .location-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .location-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .computer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .computer-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .computer-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        .computer-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .computer-ip {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            flex: 1;
            min-width: 70px;
        }
        
        .btn-message {
            background: #4CAF50;
            color: white;
        }
        
        .btn-message:hover {
            background: #45a049;
        }
        
        .btn-lock {
            background: #ff9800;
            color: white;
        }
        
        .btn-lock:hover {
            background: #fb8c00;
        }
        
        .btn-shutdown {
            background: #f44336;
            color: white;
        }
        
        .btn-shutdown:hover {
            background: #da190b;
        }
        
        .btn-reboot {
            background: #2196F3;
            color: white;
        }
        
        .btn-reboot:hover {
            background: #1976D2;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
        }
        
        .modal-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1em;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .btn-confirm {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
        }
        
        .btn-cancel {
            background: #9e9e9e;
            color: white;
            padding: 10px 20px;
        }
        
        .status-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 1001;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Veyon Web 控制端</h1>
        <div id="app"></div>
    </div>
    
    <!-- 消息弹窗 -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">发送消息到 <span id="messageTarget"></span></h3>
            <input type="text" id="messageInput" class="modal-input" placeholder="请输入消息内容">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-confirm" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
    
    <!-- 状态提示 -->
    <div id="statusBar" class="status-bar"></div>

    <script>
        let currentComputer = null;
        
        // 加载计算机列表
        async function loadComputers() {
            try {
                const response = await fetch('/api/computers');
                const data = await response.json();
                renderComputers(data);
            } catch (error) {
                showStatus('加载计算机列表失败：' + error.message, true);
            }
        }
        
        // 渲染计算机列表
        function renderComputers(data) {
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            data.forEach(location => {
                const section = document.createElement('div');
                section.className = 'location-section';
                
                const title = document.createElement('h2');
                title.className = 'location-title';
                title.textContent = `📍 ${location.name}`;
                section.appendChild(title);
                
                const grid = document.createElement('div');
                grid.className = 'computer-grid';
                
                location.computers.forEach(computer => {
                    const card = document.createElement('div');
                    card.className = 'computer-card';
                    card.innerHTML = `
                        <div class="computer-name">💻 ${computer.name}</div>
                        <div class="computer-ip">IP: ${computer.ip}</div>
                        <div class="button-group">
                            <button class="btn btn-message" onclick="openMessageModal('${computer.name}')">发消息</button>
                            <button class="btn btn-lock" onclick="lockComputer('${computer.name}')">锁定</button>
                            <button class="btn btn-reboot" onclick="rebootComputer('${computer.name}')">重启</button>
                            <button class="btn btn-shutdown" onclick="shutdownComputer('${computer.name}')">关机</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                section.appendChild(grid);
                app.appendChild(section);
            });
        }
        
        // 打开消息弹窗
        function openMessageModal(computerName) {
            currentComputer = computerName;
            document.getElementById('messageTarget').textContent = computerName;
            document.getElementById('messageInput').value = '';
            document.getElementById('messageModal').style.display = 'flex';
            document.getElementById('messageInput').focus();
        }
        
        // 关闭弹窗
        function closeModal() {
            document.getElementById('messageModal').style.display = 'none';
            currentComputer = null;
        }
        
        // 发送消息
        async function sendMessage() {
            const message = document.getElementById('messageInput').value.trim();
            if (!message) {
                alert('请输入消息内容');
                return;
            }
            
            try {
                const response = await fetch('/api/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        computer: currentComputer,
                        message: message
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    showStatus(`✓ 消息已发送到 ${currentComputer}`);
                    closeModal();
                } else {
                    showStatus('✗ 发送失败：' + result.error, true);
                }
            } catch (error) {
                showStatus('✗ 发送失败：' + error.message, true);
            }
        }
        
        // 锁定电脑
        async function lockComputer(computer) {
            if (!confirm(`确定要锁定 ${computer} 吗？`)) return;
            
            try {
                const response = await fetch('/api/lock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ computer })
                });
                
                const result = await response.json();
                if (result.success) {
                    showStatus(`✓ ${computer} 已锁定`);
                } else {
                    showStatus('✗ 锁定失败：' + result.error, true);
                }
            } catch (error) {
                showStatus('✗ 锁定失败：' + error.message, true);
            }
        }
        
        // 重启电脑
        async function rebootComputer(computer) {
            if (!confirm(`确定要重启 ${computer} 吗？`)) return;
            
            try {
                const response = await fetch('/api/reboot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ computer })
                });
                
                const result = await response.json();
                if (result.success) {
                    showStatus(`✓ ${computer} 正在重启`);
                } else {
                    showStatus('✗ 重启失败：' + result.error, true);
                }
            } catch (error) {
                showStatus('✗ 重启失败：' + error.message, true);
            }
        }
        
        // 关机
        async function shutdownComputer(computer) {
            if (!confirm(`确定要关闭 ${computer} 吗？此操作不可撤销！`)) return;
            
            try {
                const response = await fetch('/api/shutdown', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ computer })
                });
                
                const result = await response.json();
                if (result.success) {
                    showStatus(`✓ ${computer} 正在关机`);
                } else {
                    showStatus('✗ 关机失败：' + result.error, true);
                }
            } catch (error) {
                showStatus('✗ 关机失败：' + error.message, true);
            }
        }
        
        // 显示状态提示
        function showStatus(message, isError = false) {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = message;
            statusBar.style.background = isError ? '#f44336' : '#4CAF50';
            statusBar.style.display = 'block';
            
            setTimeout(() => {
                statusBar.style.display = 'none';
            }, 3000);
        }
        
        // 页面加载时初始化
        window.onload = loadComputers;
        
        // 按回车发送消息
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
