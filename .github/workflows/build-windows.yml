name: Build Windows (web-ui)

# 在 GitHub 云端的 Windows 服务器上构建 web-ui 分支，
# 产出 Windows x64 可运行的 Veyon（含内置 Web 管理界面），
# 自动打包为 zip 并发布为预发布版本（tag: webui-latest）。
#
# 触发方式：
#   1) 推送涉及 plugins/webapi/**、scripts/build-win64.sh 或本文件的提交到 web-ui 分支时自动构建
#   2) 仓库 Actions 页面手动 "Run workflow"
#
# 说明：不使用 msys2/setup-msys2 action（其在当前 runner 上稳定失败），
# 改为手动下载 MSYS2 基础包并初始化，构建逻辑见 scripts/build-win64.sh。

on:
  push:
    branches: [web-ui]
    paths:
      - '.github/workflows/build-windows.yml'
      - 'plugins/webapi/**'
      - 'scripts/build-win64.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win64:
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download MSYS2 base package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -L --retry 3 --retry-delay 5 -o "$env:RUNNER_TEMP\msys2.tar.xz" `
            https://repo.msys2.org/distrib/x86_64/msys2-base-x86_64-20260322.tar.xz
          Write-Host "Downloaded bytes: $((Get-Item "$env:RUNNER_TEMP\msys2.tar.xz").Length)"

      - name: Extract MSYS2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "C:\Program Files\7-Zip\7z.exe" x "$env:RUNNER_TEMP\msys2.tar.xz" -o"$env:RUNNER_TEMP\msys2x" -y
          # 7-Zip 解 xz 时按输入文件名去扩展名输出（msys2.tar）；动态查找兜底
          $tarPath = "$env:RUNNER_TEMP\msys2x\msys2.tar"
          if (-not (Test-Path $tarPath)) {
            $tarPath = Get-ChildItem "$env:RUNNER_TEMP\msys2x" -Filter *.tar | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Extracting: $tarPath"
          & "C:\Program Files\7-Zip\7z.exe" x $tarPath -o"D:\" -y
          if (-not (Test-Path D:\msys64\usr\bin\bash.exe)) { throw "bash.exe not found after extraction" }

      - name: Init MSYS2 keyring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:\msys64\usr\bin\bash.exe -lc "pacman-key --init && pacman-key --populate msys2"

      - name: Update MSYS2 (pass 1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"

      - name: Update MSYS2 (pass 2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm git base-devel mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-5compat mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-qt6-httpserver mingw-w64-ucrt-x86_64-qt6-websockets mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-qca mingw-w64-ucrt-x86_64-openssl mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-libjpeg-turbo mingw-w64-ucrt-x86_64-lzo2 mingw-w64-ucrt-x86_64-icu"

      - name: Configure, build & package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:\msys64\usr\bin\bash.exe -lc "cd `"$(cygpath -u $env:GITHUB_WORKSPACE)`" && bash scripts/build-win64.sh"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyon-webui-win64
          path: veyon-webui-win64.zip
          retention-days: 14

      - name: Publish pre-release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webui-latest
          name: Veyon Web UI (Windows x64) - web-ui 分支自动构建
          body: |
            自动构建产物（Windows 64 位，含内置 Web 管理界面）。

            使用方式：
            1. 解压 zip 到教师机任意目录
            2. 以管理员身份运行 veyon-server.exe（服务模式）或按 Veyon 常规方式启动服务
            3. 在浏览器打开 http://<教师机IP>:11080/，即可看到监控/控制界面

            说明：此为预发布（pre-release），每次推送 web-ui 分支代码后自动更新。
          files: veyon-webui-win64.zip
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
